[package]
name = "bonfire-fcm"
version = "0.1.0"
description = """
Utility library for the Bonfire API client which implements FCM/GCM protocol for receiving push
notifications
"""
documentation = "https://docs.rs/bonfire-fcm"
readme = "README.md"
keywords = ["bonfire", "fcm", "firebase", "push"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "src/proto/**/*.proto", "build.rs"]

edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
serde = []

[dependencies]
backon = "1.6"
base64 = "0.23"
bytes = "1.12"
chrono = "0.4"
ece = "2.3"
futures = "0.3"
http = "1.5"
http-body-util = "0.1"
hyper = "1.11"
hyper-util = { version = "0.1", features = ["client", "tokio", "tracing"] }
prost = "0.14"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["net"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.26", features = ["serde", "v4"] }
webpki-roots = "1.0"

[dependencies.hyper-rustls]
version = "0.27"
default-features = false
features = ["aws-lc-rs", "http2", "logging", "native-tokio", "tls12", "webpki-roots"]

[dependencies.jwt]
package = "bonfire-jwt"
path = "../bonfire-jwt"
version = "0.1.0"

[build-dependencies]
prost-build = "0.14"
walkdir = "2.5"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
