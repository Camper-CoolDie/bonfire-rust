[package]
name = "bonfire"
version = "0.1.0"
description = "Client library for the Bonfire API"
documentation = "https://docs.rs/bonfire"
keywords = ["bonfire", "api", "bot"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "src/graphql/**/*.graphql", "build.rs"]

edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["http2"]
http1 = ["hyper-rustls/http1"]
http2 = ["hyper-rustls/http2"]
serde = ["fcm?/serde"]

[dependencies]
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
governor = "0.10"
http = "1.5"
http-body-util = "0.1"
hyper = "1.11"
hyper-util = { version = "0.1", features = ["client", "tokio", "tracing"] }
include_dir = "0.7"
nonzero_ext = "0.3"
os_info = "3.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "sync"] }
tracing = "0.1"

[dependencies.fcm]
package = "bonfire-fcm"
path = "../bonfire-fcm"
version = "0.1.0"
optional = true

[dependencies.hyper-rustls]
version = "0.27"
default-features = false
features = ["aws-lc-rs", "logging", "native-tokio", "tls12", "webpki-roots"]

[dependencies.jwt]
package = "bonfire-jwt"
path = "../bonfire-jwt"
version = "0.1.0"

[dev-dependencies]
anyhow = "1.0"
cmp = { version = "1.0", features = ["serde"] }
futures-util = "0.3"
httpmock = "0.8"
nanoid = "0.5"
ron = "0.12"
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[build-dependencies]
graphql-minify = "0.1"
walkdir = "2.5"

[[example]]
name = "search_accounts"
required-features = ["serde"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
