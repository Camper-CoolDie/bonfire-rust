[package]
name = "bonfire-core"
version = "0.1.0"
description = "Core components and shared types for the Bonfire API library"
documentation = "https://docs.rs/bonfire-core"
readme = "README.md"
keywords = ["bonfire", "core"]
categories = ["rust-patterns"]

edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[lints]
workspace = true
